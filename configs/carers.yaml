# Carers on shift and their alert tier. Tier 1 carers get alerts for the rooms that
# list them; tier 2 is everyone on shift; tier 3 is the senior on call.
# Push topics are private: put them in configs/server.local.yaml, e.g.
#   carers:
#     Khush Mehta: {topic: fallsense-khush-xxxxxxxx}
carers:
  - {name: Khush Mehta, tier: 1}
  - {name: Ananth Harinarain, tier: 1}
  - {name: Ruth Adebayo, tier: 3, role: Senior nurse}
