# One camera per room. Every room replays recorded clips: their skeletons (Contract 1)
# play in real time over the clip's own video, and the scores and alerts are the
# backend's own (model_run in server.yaml).
#
# idle: clips looped in order while nothing is happening (picked with
#   scripts/12_demo_clips.py --run e9_ens_gru: no alert, low fall score, person always
#   visible; videos fetched with scripts/13_demo_videos.py)
# scenarios: clips the presenter plays on cue; hold_s keeps the last pose and
#   scores after the clip ends, so ON FLOOR (20 s) can fire on short public clips.
#   {recording: latest} is the newest scripts/09_live.py --record session (webcam
#   video, skeleton, and the scores and alerts the live script decided).
rooms:
  - id: r1
    camera: CAM 01
    name: Room 1
    resident: M.H.
    carers: [Khush Mehta]
    source: replay
    idle:
      - {dataset: GMDCSA24, path: Subject_2/ADL/07}
      - {dataset: GMDCSA24, path: Subject_2/ADL/18}
      - {dataset: GMDCSA24, path: Subject_2/ADL/21}
