# One camera per room. Every room is a replay of recorded clips for now: their
# skeletons (Contract 1) play in real time, and the scores and alerts are the
# backend's own (model_run in server.yaml). When the backend's live loop exists,
# CAM 04 switches to `source: live` (webcam).
#
# idle: clips looped in order while nothing is happening (picked with
#   scripts/12_demo_clips.py: no alert, low fall score, person always visible)
# scenarios: clips the presenter plays on cue; hold_s keeps the last pose and
#   scores after the clip ends, so ON FLOOR (20 s) can fire on short public clips
rooms:
  - id: r1
    camera: CAM 01
    name: Room 1
    resident: M.H.
    carers: [Khush Mehta]
    source: replay
    idle:
      - {dataset: GMDCSA24, path: Subject_2/ADL/07}
      - {dataset: GMDCSA24, path: Subject_2/ADL/18}
      - {dataset: GMDCSA24, path: Subject_2/ADL/21}
  - id: r2
    camera: CAM 02
    name: Room 2
    resident: J.P.
    carers: [Khush Mehta]
    source: replay
    idle:
      - {dataset: caucafall, path: adl/WalkS10}
      - {dataset: le2i, path: Home_02/video_51}
  - id: r3
    camera: CAM 03
    name: Room 3
    resident: E.K.
    carers: [Ananth Harinarain]
    source: replay
    idle:
      - {dataset: GMDCSA24, path: Subject_2/ADL/08}
      - {dataset: GMDCSA24, path: Subject_2/ADL/03}
  - id: r4
    camera: CAM 04
    name: Room 4
    resident: D.R.
    carers: [Khush Mehta, Ananth Harinarain]
    source: replay
    idle:
      - {dataset: GMDCSA24, path: Subject_2/ADL/06}
      - {dataset: GMDCSA24, path: Subject_2/ADL/11}
    scenarios:
      fall: {dataset: GMDCSA24, path: Subject_2/Fall/02, hold_s: 45}
  - id: r5
    camera: CAM 05
    name: Room 5
    resident: S.N.
