[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fallsense"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

# Shared by both laptops; .githooks/pre-push and the Claude hook run the same checks.
[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Ruff's default rules plus type annotations on every function.
extend-select = ["ANN"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "tests"]
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Libraries that ship without type information.
[[tool.mypy.overrides]]
module = ["mediapipe", "mediapipe.*", "omnifall", "omnifall.*", "av", "av.*"]
ignore_missing_imports = true
