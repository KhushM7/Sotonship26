[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fallsense"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

# Shared by both laptops; .githooks/pre-push and the Claude hook run ruff with these settings.
[tool.ruff]
target-version = "py311"
line-length = 88
# The plans quote code as illustration; ruff would otherwise format the snippets.
extend-exclude = ["docs"]

# Type hints are welcome but not enforced: no ANN rules, and mypy is optional
# (run `python -m mypy` by hand if you want a type check).
[tool.mypy]
python_version = "3.11"
files = ["src", "scripts", "tests"]
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Libraries that ship without type information.
[[tool.mypy.overrides]]
module = ["mediapipe", "mediapipe.*", "omnifall", "omnifall.*", "av", "av.*"]
ignore_missing_imports = true
